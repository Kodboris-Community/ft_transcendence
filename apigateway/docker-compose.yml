version: '3.8'

services:
  apigateway:
    build: ./apigateway
    environment:
      - SECRET_KEY=${ApiGateway_SECRET_KEY}
      - DEBUG=${ApiGateway_DEBUG}
      - FRONTEND_URL=https://jaiyelearningdevops.com
      - ALLOWED_HOSTS=localhost,127.0.0.1,10.0.0.20,apigateway
    volumes:
      - ./apigateway:/app
    ports:
      - "8000:8000"
    networks:
      - backend

networks:
  backend:
    driver: bridge
