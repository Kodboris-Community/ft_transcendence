version: '3.8'

services:
  apigateway:
    container_name: apigateway
    build: .
    environment:
      - SECRET_KEY=${ApiGateway_SECRET_KEY}
      - DEBUG=${ApiGateway_DEBUG}
      - FRONTEND_URL=https://20.162.86.174
      - ALLOWED_HOSTS=apigateway,20.162.86.174,192.168.1.68,192.168.1.132
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    networks:
      - backend
      - frontend
    hostname: apigateway

networks:
  backend:
    driver: bridge
  frontend:
    driver: bridge
