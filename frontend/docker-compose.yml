version: '3.8'

services:
  frontend:
    container_name: frontend
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NGINX_SSL_CN=${NGINX_SSL_CN}
    environment:
      - SERVER_NAME=${SERVER_NAME}
    ports:
      - "443:443"
      - "80:80"  # Optional: Expose port 80 to allow Let's Encrypt HTTP challenges
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro  # Mount Let's Encrypt certs
    networks:
      - frontend
    hostname: frontend

networks:
  frontend:
    driver: bridge