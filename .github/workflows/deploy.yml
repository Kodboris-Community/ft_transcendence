name: Deploy microservices

on:
  push:
    branches:
      - apigateway/microservices_Jaiye

jobs:
  trivy-scan-backend:
    name: Trivy Scan Backend Services
    runs-on: [self-hosted, backend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Scan each backend service directory
        run: |
          mkdir -p trivy-reports
          for dir in backend/*; do
            if [ -f "$dir/Dockerfile" ]; then
              service_name=$(basename $dir)
              echo "🔍 Scanning $service_name..."
              docker build -t ${service_name}-image $dir
              trivy image --format table --output trivy-reports/${service_name}.txt ${service_name}-image || echo "Trivy failed for $service_name"
            fi
          done

      - name: Upload Trivy Reports
        uses: actions/upload-artifact@v3.1.3
        with:
          name: backend-trivy-reports
          path: trivy-reports/

  deploy-backend:
    name: Deploy Backend
    needs: trivy-scan-backend
    runs-on: [self-hosted, backend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy backend with Docker Compose
        working-directory: backend
        run: |
          echo "Deploying backend..."
          echo "${{ secrets.BACK_ENV_FILE }}" > .env
          docker compose down
          docker compose up -d --build

  trivy-scan-apigateway:
    name: Trivy Scan API Gateway
    runs-on: [self-hosted, apigateway]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Scan API Gateway
        run: |
          mkdir -p trivy-reports
          docker build -t apigateway-image apigateway
          trivy image --format table --output trivy-reports/apigateway.txt apigateway-image || echo "Trivy failed for apigateway"

      - name: Upload Trivy Reports
        uses: actions/upload-artifact@v3.1.3
        with:
          name: apigateway-trivy-report
          path: trivy-reports/

  deploy-apigateway:
    name: Deploy API Gateway
    needs: deploy-backend
    runs-on: [self-hosted, apigateway]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy API Gateway with Docker Compose
        working-directory: apigateway
        run: |
          echo "Deploying API Gateway..."
          echo "${{ secrets.APIG_ENV_FILE }}" > .env
          docker compose down
          docker compose up -d --build

  trivy-scan-frontend:
    name: Trivy Scan Frontend
    runs-on: [self-hosted, frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Scan Frontend
        run: |
          mkdir -p trivy-reports
          docker build -t frontend-image frontend
          trivy image --format table --output trivy-reports/frontend.txt frontend-image || echo "Trivy failed for frontend"

      - name: Upload Trivy Reports
        uses: actions/upload-artifact@v3.1.3
        with:
          name: frontend-trivy-report
          path: trivy-reports/

  deploy-frontend:
    name: Deploy Frontend
    needs: deploy-apigateway
    runs-on: [self-hosted, frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy Frontend with Docker Compose
        working-directory: frontend
        run: |
          echo "Deploying frontend..."
          echo "${{ secrets.FRONT_ENV_FILE }}" > .env
          docker compose down
          docker compose up -d --build
