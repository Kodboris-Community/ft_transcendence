name: Deploy microservices

on:
  push:
    branches:
      - apigateway/microservices_Jaiye

jobs:
  scan-backend:
    name: Scan Backend Services
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh
          sudo mv trivy /usr/local/bin/

      - name: Build and Scan Backend Services
        run: |
          mkdir trivy-backend-reports
          for dir in backend/*/ ; do
            service=$(basename "$dir")
            docker build -t "$service-image" "./backend/$service"
            trivy image --severity CRITICAL,HIGH --format table --output "trivy-backend-reports/${service}_trivy_report.txt" "$service-image"
          done

      - name: Upload Backend Trivy Reports
        uses: actions/upload-artifact@v3
        with:
          name: trivy-backend-reports
          path: trivy-backend-reports/

  scan-apigateway:
    name: Scan API Gateway
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh
          sudo mv trivy /usr/local/bin/

      - name: Build and Scan API Gateway
        run: |
          docker build -t apigateway-image ./apigateway
          trivy image --severity CRITICAL,HIGH --format table --output trivy-apigateway.txt apigateway-image

      - name: Upload API Gateway Trivy Report
        uses: actions/upload-artifact@v3
        with:
          name: trivy-apigateway-report
          path: trivy-apigateway.txt

  scan-frontend:
    name: Scan Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh
          sudo mv trivy /usr/local/bin/

      - name: Build and Scan Frontend
        run: |
          docker build -t frontend-image ./frontend
          trivy image --severity CRITICAL,HIGH --format table --output trivy-frontend.txt frontend-image

      - name: Upload Frontend Trivy Report
        uses: actions/upload-artifact@v3
        with:
          name: trivy-frontend-report
          path: trivy-frontend.txt

  deploy-backend:
    name: Deploy Backend
    needs: scan-backend
    runs-on: [self-hosted, backend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy backend with Docker Compose
        working-directory: backend
        run: |
          echo "Deploying backend..."
          echo "${{ secrets.BACK_ENV_FILE }}" > .env
          docker compose down
          docker compose up -d --build

  deploy-apigateway:
    name: Deploy API Gateway
    needs: [deploy-backend, scan-apigateway]
    runs-on: [self-hosted, apigateway]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy API Gateway with Docker Compose
        working-directory: apigateway
        run: |
          echo "Deploying API Gateway..."
          echo "${{ secrets.APIG_ENV_FILE }}" > .env
          docker compose down
          docker compose up -d --build

  deploy-frontend:
    name: Deploy Frontend 
    needs: [deploy-apigateway, scan-frontend]
    runs-on: [self-hosted, frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy Frontend with Docker Compose
        working-directory: frontend
        run: |
          echo "Deploying frontend..."
          echo "${{ secrets.FRONT_ENV_FILE }}" > .env
          docker compose down
          docker compose up -d --build
