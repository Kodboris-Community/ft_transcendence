name: CI/CD Pipeline for Microservice Architecture

on:
  push:
    branches:
      - taiwo-transcendence
  pull_request:
    branches:
      - taiwo-transcendence

env:
  AZURE_CONTAINER_REGISTRY: ${{ secrets.AZURE_TEEWAI_CONTAINER_REGISTRY }}
  AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_TEEWAI_RESOURCE_GROUP }}
  AZURE_CREDENTIALS: ${{ secrets.AZURE_TEEWAI_CREDENTIALS }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build:
    name: Build and Push Frontend Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_TEEWAI_CREDENTIALS }}

      - name: Login to Azure Container Registry (ACR)
        run: az acr login --name ${{ secrets.AZURE_TEEWAI_CONTAINER_REGISTRY }}

      - name: Build and push frontend image
        run: |
          ACR_NAME=${{ secrets.AZURE_TEEWAI_CONTAINER_REGISTRY }}
          IMAGE_URI=$ACR_NAME.azurecr.io/kodmicroservices

          cd frontend
          docker build -t $IMAGE_URI:frontend-${{ env.IMAGE_TAG }} .
          docker push $IMAGE_URI:frontend-${{ env.IMAGE_TAG }}
          cd ..

          echo "$IMAGE_URI" > acr_registry.txt

      - name: Upload ACR Registry Info
        uses: actions/upload-artifact@v4
        with:
          name: acr-registry
          path: acr_registry.txt

  deploy-backend:
    name: Build, Deploy & Push Backend from EC2
    runs-on: [self-hosted, linux, backend-azure-runner]
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Azure CLI (if not present)
        run: |
          if ! command -v az &> /dev/null; then
            echo "Azure CLI not found. Installing..."
            curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
          else
            echo "Azure CLI already installed."
          fi

      - name: Azure CLI Login
        run: |
          echo '${{ secrets.AZURE_TEEWAI_CREDENTIALS }}' > azurecreds.json
          az login --service-principal \
            -u ${{ fromJson(secrets.AZURE_TEEWAI_CREDENTIALS).clientId }} \
            -p ${{ fromJson(secrets.AZURE_TEEWAI_CREDENTIALS).clientSecret }} \
            --tenant ${{ fromJson(secrets.AZURE_TEEWAI_CREDENTIALS).tenantId }}
          az acr login --name ${{ secrets.AZURE_TEEWAI_CONTAINER_REGISTRY }}

      - name: Inject backend .env
        run: |
          cd backend
          echo "${{ secrets.BACKEND_ENV_FILE }}" > .env

      - name: Build, deploy, and push backend services
        run: |
          ACR_NAME=${{ secrets.AZURE_TEEWAI_CONTAINER_REGISTRY }}
          IMAGE_URI=$ACR_NAME.azurecr.io/kodmicroservices

          cd backend

          for service in authservice bucketservice friendservice gameplayservice gameservice mailservice statusservice usermanagement; do
            echo "Building and pushing $service..."
            docker build -t $IMAGE_URI:$service-${{ env.IMAGE_TAG }} $service
            docker push $IMAGE_URI:$service-${{ env.IMAGE_TAG }}
          done

          docker compose down
          docker compose up -d --build --force-recreate

  deploy-apigateway:
    name: Build, Deploy & Push API Gateway from EC2
    runs-on: [self-hosted, linux, gateway-azure-runner]
    needs: deploy-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Azure CLI (if not present)
        run: |
          if ! command -v az &> /dev/null; then
            echo "Azure CLI not found. Installing..."
            curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
          else
            echo "Azure CLI already installed."
          fi

      - name: Azure CLI Login
        run: |
          echo '${{ secrets.AZURE_TEEWAI_CREDENTIALS }}' > azurecreds.json
          az login --service-principal \
            -u ${{ fromJson(secrets.AZURE_TEEWAI_CREDENTIALS).clientId }} \
            -p ${{ fromJson(secrets.AZURE_TEEWAI_CREDENTIALS).clientSecret }} \
            --tenant ${{ fromJson(secrets.AZURE_TEEWAI_CREDENTIALS).tenantId }}
          az acr login --name ${{ secrets.AZURE_TEEWAI_CONTAINER_REGISTRY }}

      - name: Inject .env into API Gateway
        run: |
          cd apigateway
          echo "${{ secrets.APIGATEWAY_ENV_FILE }}" > .env

      - name: Build, deploy, and push API Gateway
        run: |
          ACR_NAME=${{ secrets.AZURE_TEEWAI_CONTAINER_REGISTRY }}
          IMAGE_URI=$ACR_NAME.azurecr.io/kodmicroservices

          cd apigateway
          docker build -t $IMAGE_URI:apigateway-${{ env.IMAGE_TAG }} .
          docker push $IMAGE_URI:apigateway-${{ env.IMAGE_TAG }}

          docker compose down
          docker compose up -d --build --force-recreate

  deploy-frontend:
    name: Deploy Frontend to EC2
    runs-on: ubuntu-latest
    needs: deploy-apigateway

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: acr-registry

      - run: echo "ACR_REGISTRY=$(cat acr_registry.txt)" >> $GITHUB_ENV

      - name: SSH to frontend instance
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.TEEWAI_AZURE_FRONTEND_HOST }}
          username: ${{ secrets.TEEWAI_AZURE_FRONTEND_USER }}
          key: ${{ secrets.TEEWAI_AZURE_FRONTEND_KEY }}
          port: ${{ secrets.PORT }}
          script: |
            cd ft_transcendence/frontend
            yq e ".services.frontend.image = '${{ env.ACR_REGISTRY }}:frontend-${{ env.IMAGE_TAG }}'" -i docker-compose.yml
            docker compose pull
            docker compose up -d --force-recreate