name: CI/CD Pipeline for Microservice Architecture

on:
  push:
    branches:
      - taiwo-transcendence
  pull_request:
    branches:
      - taiwo-transcendence

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker images
        run: |
          ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY=kodmicroservices

          # Build frontend
          cd frontend
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:frontend .
          cd ..

          # Build apigateway
          cd apigateway
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:apigateway .
          cd ..

          # Build backend microservices
          for service in authservice bucketservice friendservice gameplayservice gameservice mailservice statusservice usermanagement; do
            echo "Building $service..."
            cd backend/$service
            docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$service .
            cd ../..
          done

          echo "Pushing all images..."
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:frontend
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:apigateway
          for service in authservice bucketservice friendservice gameplayservice gameservice mailservice statusservice usermanagement; do
            docker push $ECR_REGISTRY/$ECR_REPOSITORY:$service
          done

          echo "$ECR_REGISTRY" > ecr_registry.txt

      - name: Upload ECR Registry Info
        uses: actions/upload-artifact@v4
        with:
          name: ecr-registry
          path: ecr_registry.txt

  deploy-frontend:
    name: Deploy Frontend to EC2
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ecr-registry

      - run: echo "ECR_REGISTRY=$(cat ecr_registry.txt)" >> $GITHUB_ENV

      - name: SSH to frontend instance
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.TEEWAI_FRONTEND_HOST }}
          username: ${{ secrets.TEEWAI_FRONTEND_USER }}
          key: ${{ secrets.TEEWAI_FRONTEND_KEY }}
          port: ${{ secrets.PORT }}
          script: |
            cd ft_transcendence/frontend
            yq e ".services.frontend.image = '${{ env.ECR_REGISTRY }}/kodmicroservices:frontend'" -i docker-compose.yml
            docker compose pull
            docker compose up -d --force-recreate

  deploy-apigateway:
    name: Deploy API Gateway to EC2
    runs-on: [self-hosted, linux, apigateway-runner]  # updated to use self-hosted runner
    needs: build

    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - uses: actions/download-artifact@v4
        with:
          name: ecr-registry

      - run: echo "ECR_REGISTRY=$(cat ecr_registry.txt)" >> $GITHUB_ENV

      - name: Update and restart API Gateway service
        run: |
          cd ft_transcendence/apigateway
          yq e ".services.apigateway.image = '${{ env.ECR_REGISTRY }}/kodmicroservices:apigateway'" -i docker-compose.yml
          docker compose pull
          docker compose up -d --force-recreate

  deploy-backend:
    name: Deploy Backend Services to EC2
    runs-on: [self-hosted, linux, backend-runner]  # updated to use self-hosted runner
    needs: build

    steps:
      - name: Checkout source code
        uses: actions/checkout@v3
        
      - uses: actions/download-artifact@v4
        with:
          name: ecr-registry

      - run: echo "ECR_REGISTRY=$(cat ecr_registry.txt)" >> $GITHUB_ENV

      - name: Update and restart backend services
        run: |
          cd ft_transcendence/backend
          for service in authservice bucketservice friendservice gameplayservice gameservice mailservice statusservice usermanagement; do
            yq e ".services.${service}.image = '${{ env.ECR_REGISTRY }}/kodmicroservices:${service}'" -i docker-compose.yml
          done
          docker compose pull
          docker compose up -d --force-recreate