name: CI/CD Pipeline for Microservice Architecture

on:
  push:
    branches:
      - taiwo-transcendence
  pull_request:
    branches:
      - taiwo-transcendence

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker images
        run: |
          ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY=kodmicroservices

          # Build frontend
          cd frontend
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:frontend .
          cd ..
          
          echo "Pushing all images..."
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:frontend

          echo "$ECR_REGISTRY" > ecr_registry.txt

      - name: Upload ECR Registry Info
        uses: actions/upload-artifact@v4
        with:
          name: ecr-registry
          path: ecr_registry.txt

  deploy-backend:
    name: Deploy Backend to EC2 (Self-hosted)
    runs-on: [self-hosted, linux, backend-runner]
    needs: build

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Inject .env files into each backend microservice
        run: |
          cd backend
            echo "${{ secrets.BACKEND_ENV_FILE }}" > .env
          done

      - name: Build and deploy backend services locally
        run: |
          cd backend
          for service in authservice bucketservice friendservice gameplayservice gameservice mailservice statusservice usermanagement; do
            echo "Building $service..."
            cd $service
            docker build -t kodmicroservices:$service .
            cd ..
          done
          docker compose down
          docker compose up -d --build --force-recreate

  deploy-apigateway:
    name: Deploy API Gateway to EC2 (Self-hosted)
    runs-on: [self-hosted, linux, apigate-runner]
    needs: deploy-backend

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Inject .env into API Gateway
        run: |
          cd apigateway
          echo "${{ secrets.APIGATEWAY_ENV_FILE }}" > .env

      - name: Build and deploy API Gateway locally
        run: |
          cd apigateway
          docker compose down
          docker build -t kodmicroservices:apigateway .
          docker compose up -d --build --force-recreate

  deploy-frontend:
    name: Deploy Frontend to EC2
    runs-on: ubuntu-latest
    needs: deploy-apigateway

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ecr-registry

      - run: echo "ECR_REGISTRY=$(cat ecr_registry.txt)" >> $GITHUB_ENV

      - name: SSH to frontend instance
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.TEEWAI_FRONTEND_HOST }}
          username: ${{ secrets.TEEWAI_FRONTEND_USER }}
          key: ${{ secrets.TEEWAI_FRONTEND_KEY }}
          port: ${{ secrets.PORT }}
          script: |
            cd ft_transcendence/frontend
            yq e ".services.frontend.image = '${{ env.ECR_REGISTRY }}/kodmicroservices:frontend'" -i docker-compose.yml
            docker compose pull
            docker compose up -d --force-recreate
