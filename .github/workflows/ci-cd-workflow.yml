name: CI/CD Pipeline for Microservice Architecture

on:
  push:
    branches:
      - taiwo-transcendence
  pull_request:
    branches:
      - taiwo-transcendence

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build:
    name: Build and Push Microservice Images
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push all images to ECR
        id: build-and-push
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: kodmicroservices
        run: |
          echo "Building and tagging services..."
          cd frontend
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:frontend .
          cd ..

          cd apigateway
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:apigateway .
          cd ..

          cd authservice
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:authservice .
          cd ..

          cd bucketservice
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:bucketservice .
          cd ..

          cd friendservice
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:friendservice .
          cd ..

          cd gameplayservice
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:gameplayservice .
          cd ..

          cd gameservice
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:gameservice .
          cd ..

          cd mailservice
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:mailservice .
          cd ..

          cd statusservice
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:statusservice .
          cd ..

          cd usermanagement
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:usermanagement .
          cd ..
          
          echo "Pushing images to ECR..."

          docker push $ECR_REGISTRY/$ECR_REPOSITORY:frontend
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:apigateway
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:authservice
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:bucketservice
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:friendservice
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:gameplayservice
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:gameservice
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:mailservice
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:statusservice
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:usermanagement

          echo "$ECR_REGISTRY" > ecr_registry.txt

      - name: Upload ECR Registry Info
        uses: actions/upload-artifact@v4
        with:
          name: ecr-registry
          path: ecr_registry.txt

  deploy:
    name: Deploy kodmicroservices to Remote Server
    runs-on: ubuntu-latest
    needs: build
    env:
      ECR_REPOSITORY: microservice-communication
      DIRECTORY: MicroService-Communication-with-RabbitMQ-in-Docker
      COMPOSE: docker-compose.yml

    steps:
      - name: Download ECR Registry Info
        uses: actions/download-artifact@v4
        with:
          name: ecr-registry
          path: .

      - name: Read ECR Registry
        run: |
          ECR_REGISTRY=$(cat ecr_registry.txt)
          echo "ECR_REGISTRY=$ECR_REGISTRY" >> $GITHUB_ENV

      - name: SSH Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.TEEWAI_HOST }}
          username: ${{ secrets.TEEWAI_USERNAME }}
          key: ${{ secrets.TEEWAI_KEY }}
          port: ${{ secrets.PORT }}
          envs: GITHUB_TRIGGERING_ACTOR,GITHUB_RUN_NUMBER,ECR_REGISTRY,IMAGE_TAG,DIRECTORY,COMPOSE
          script: |
            echo "Deploying kodmicroservices from $ECR_REGISTRY"

            cd $DIRECTORY

            if [[ ! -f "$COMPOSE" ]]; then
              echo "docker-compose.yml file not found!"
              exit 1
            fi

            for service in frontend apigateway authservice bucketservice friendservice gameplayservice gameservice mailservice statusservice usermanagement; do
              echo "Updating image for $service..."
              yq e ".services.${service}.image = \"${ECR_REGISTRY}/${ECR_REPOSITORY}:${service}\"" -i $COMPOSE
            done

            docker compose pull
            docker compose up --build --force-recreate -d

            if [[ $? == 0 ]]; then
              echo "Deployment successful!"
            else
              echo "Deployment failed!"
              exit 1
            fi
